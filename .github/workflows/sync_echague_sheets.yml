name: Sync fixture Echagüe → Sheets

# Actualiza el Google Sheet de CMs con partidos Pedro Echagüe.
# El código vive en la rama `estadisticas`; este workflow en `main` solo orquesta el cron.
# Secret: GOOGLE_SERVICE_ACCOUNT_JSON (JSON completo de la service account).

on:
  schedule:
    # 08:00 y 20:00 Argentina (UTC-3) → 11:00 y 23:00 UTC
    - cron: "0 11,23 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout estadisticas (código del sync)
        uses: actions/checkout@v4
        with:
          ref: estadisticas

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl gspread google-auth

      - name: Escribir service account
        env:
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SA" ]; then
            echo "Falta secret GOOGLE_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SA" > config/google_service_account.json

      - name: Sync GES → Sheets
        run: python analysis/sync_fixture_echague_sheets.py --progress
