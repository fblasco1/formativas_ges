name: Sync fixture Echagüe → Sheets

# Actualiza el Google Sheet de CMs con partidos Pedro Echagüe y publica
# outputs/echague/fixture_echague.json (contrato SICLUB) en el repo + docs/.
# Corre sobre el árbol de `main` (producto 2026 unificado).
# Secret: GOOGLE_SERVICE_ACCOUNT_JSON (JSON completo de la service account).
#
# Modo default: incremental (solo zonas cacheadas + fases nuevas).
# Descubrimiento completo: workflow_dispatch con input full=true (o corrida sin cache).

permissions:
  contents: write

on:
  schedule:
    # 08:00 y 20:00 Argentina (UTC-3) → 11:00 y 23:00 UTC
    - cron: "0 11,23 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Recorrer todas las zonas GES (descubrimiento)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl gspread google-auth

      - name: Restaurar scopes cache
        uses: actions/cache/restore@v4
        with:
          path: outputs/echague/scopes_cache.json
          key: echague-scopes-${{ github.run_id }}
          restore-keys: |
            echague-scopes-

      - name: Escribir service account
        env:
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SA" ]; then
            echo "Falta secret GOOGLE_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SA" > config/google_service_account.json

      - name: Sync GES → Sheets + JSON
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            EXTRA="--full"
          fi
          python analysis/sync_fixture_echague_sheets.py --progress $EXTRA

      - name: Publicar JSON SICLUB
        run: |
          test -f outputs/echague/fixture_echague.json
          cp outputs/echague/fixture_echague.json docs/fixture_echague.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/echague/fixture_echague.json docs/fixture_echague.json
          if git diff --cached --quiet; then
            echo "JSON sin cambios"
            exit 0
          fi
          git commit -m "chore(echague): actualizar fixture JSON para SICLUB"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Guardar scopes cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outputs/echague/scopes_cache.json
          key: echague-scopes-${{ github.run_id }}
