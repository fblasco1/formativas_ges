name: Publicar informe comparativo

on:
  push:
    branches: [main, estadisticas]
    paths:
      - "docs/**"
      - "outputs/mini_masc/**"
      - ".github/workflows/pages.yml"
  # El sync Echagüe commitea con GITHUB_TOKEN (no dispara push).
  # Tras el cron, redeploy para servir docs/fixture_echague.json.
  workflow_run:
    workflows: ["Sync fixture Echagüe → Sheets"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
